number: P6
title: Complex geometry and Hodge theory
subtitle: Holomorphic functions of several variables, Hartogs extension, the Weierstrass theorems and the local ring O_n, the Dolbeault-Grothendieck lemma, complex manifolds and holomorphic vector bundles, Dolbeault cohomology, Hermitian metrics, the Chern connection and Chern classes, Kähler manifolds, the Hodge decomposition, the hard Lefschetz theorem and the Hodge-Riemann relations, line bundles on compact Kähler manifolds, the vanishing and embedding theorems of Kodaira, the theorems of Chow and GAGA with the Lefschetz principle, and singular metrics with analytic multiplier ideals
level: prereq
requires: [P1, P2, P3, P4]
spine: ["Huybrechts, Complex geometry: an introduction (Huy05)", "Voisin, Hodge theory and complex algebraic geometry I (Voi02)", "Griffiths and Harris, Principles of algebraic geometry, Chapters 0 and 1 (GH78)"]
chapters:
  - "1. Several complex variables: holomorphic functions of several variables and their power series, the Cauchy integral formula on polydiscs, the Hartogs and Riemann extension theorems, the Weierstrass preparation and division theorems, the local ring O_n as a Noetherian factorial regular local ring, and the Dolbeault-Grothendieck lemma"
  - "2. Complex manifolds and Dolbeault cohomology: complex manifolds and submanifolds, projective space, tori and Hopf surfaces, holomorphic vector bundles and the line bundles O(d), the Picard group as H^1(X, O^*), adjunction, Dolbeault cohomology and the theorems of Dolbeault and de Rham, and the cohomology of the projective line and of complex tori"
  - "3. Hermitian geometry and Chern classes: Hermitian metrics and positive (1,1)-forms, connections and curvature, the Chern connection of a Hermitian holomorphic bundle, Chern classes by Chern-Weil theory, the integral first Chern class from the exponential sequence, and the Fubini-Study metric with c_1(O(1))"
  - "4. Kähler manifolds and Hodge theory: Kähler metrics and their local potentials, Lefschetz linear algebra and the Kähler identities, the Hodge theorem, the Hodge decomposition and Hodge symmetry, the hard Lefschetz theorem and the Hodge-Riemann bilinear relations, and the Hodge numbers of projective space, curves, tori and surfaces"
  - "5. Line bundles on compact Kähler manifolds: the exponential sequence, the Picard torus Pic^0 and the Néron-Severi group, the Lefschetz theorem on (1,1) classes, and divisors and line bundles on compact Kähler manifolds"
  - "6. Kodaira vanishing and Kodaira embedding: positive line bundles, the Bochner-Kodaira-Nakano identity, the vanishing theorems of Kodaira and Akizuki-Nakano, and the Kodaira embedding theorem"
  - "7. Chow, GAGA and the Lefschetz principle: analytic subvarieties of projective space, Chow's theorem, Serre's GAGA theorems on coherent sheaves and their cohomology, and the transfer of results from the complex numbers to an algebraically closed field of characteristic zero"
  - "8. Singular metrics and analytic multiplier ideals: plurisubharmonic functions, singular Hermitian metrics and currents, Lelong numbers, analytic multiplier ideal sheaves, Hörmander's L^2 estimates and Nadel vanishing"
