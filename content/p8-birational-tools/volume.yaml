number: P8
title: Tools of birational geometry
subtitle: Rational curves, morphism spaces and bend-and-break, uniruled and rationally connected varieties, resolution of singularities and log resolutions, cones, fans and toric varieties, toric divisors, toric resolution and the toric cone theorem, and the singularities of the minimal model program
level: prereq
requires: [P4, P5, P7]
spine: ["Debarre, Higher-dimensional algebraic geometry (Deb01)", "Kollár and Mori, Birational geometry of algebraic varieties (KM98)", "Kollár, Lectures on resolution of singularities (Kol07)", "Cox, Little and Schenck, Toric varieties (CLS11)", "Reid, Young person's guide to canonical singularities (Rei87)", "Fulton, Introduction to toric varieties (Ful93)"]
chapters:
  - "1. Hom and Hilbert schemes: the Hilbert and Hom schemes, the tangent space and the dimension estimate for morphisms from a curve, and lines and conics as first examples"
  - "2. Bend-and-break: breaking a family of curves with two fixed points, Mori's theorem on rational curves through a point of a variety with K-negative curves, and the bound on the degree"
  - "3. Uniruled and rationally connected varieties: free and very free rational curves, uniruledness and the canonical class, rational connectedness, Fano varieties and the theorem of Graber, Harris and Starr"
  - "4. Resolution of curves and surfaces: normalization of curves, the embedded resolution of plane curves and the minimal log resolution, and the resolution of surfaces by Jung's method"
  - "5. Hironaka's theorem, as statements: resolution, principalization and log resolutions in characteristic zero with their consequences, weak factorization, and resolution in positive characteristic"
  - "6. Cones, fans and toric varieties: rational polyhedral cones and duality, Gordan's lemma, affine toric varieties and their gluing along fans, the orbit-cone correspondence, smoothness and completeness"
  - "7. Toric divisors: torus-invariant prime divisors, the class group and the Picard group, the Cartier criterion, the canonical divisor, support functions and global sections"
  - "8. Toric resolution and the toric cone: refinements of fans, the resolution of toric surface singularities by continued fractions, wall curves and their intersection numbers, and the toric cone theorem"
  - "9. Quotient singularities: quotients of affine varieties by finite groups, the Chevalley-Shephard-Todd theorem, small groups, and cyclic quotient singularities as toric varieties"
  - "10. Du Val singularities: (-2)-configurations and the ADE graphs, the resolutions of A_n and D_4, and the equivalence of Du Val, crepant, rational double point and rational Gorenstein"
  - "11. Rational singularities: Kovács's splitting criterion, quotient singularities are rational, Artin's criterion, and the multiplicity and embedding dimension of rational surface singularities"
  - "12. Cones over varieties: the affine cone over a polarized variety, its blow-up at the vertex, the class group, the canonical class and the discrepancy of the exceptional divisor"
  - "13. First discrepancies: the discrepancy of a divisor over a normal variety, independence of the model, terminal, canonical, klt and log canonical singularities, and the discrepancies of surface singularities"
